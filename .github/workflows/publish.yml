name: publish
on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # UTC, every 15 min at off-peak minutes (GitHub throttles/delays */N and :00/:30); posts go out within ~15-30 min of publish_at
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: create the containers only, publish nothing"
        type: boolean
        default: false
concurrency:
  group: ig-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: bun scripts/publish-queue.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit queue changes
        if: always()
        run: |
          git config user.name "ig-publisher"
          git config user.email "ig-publisher@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "queue update [skip ci]" && git push)
